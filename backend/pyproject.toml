[tool.poetry]
name = "ai-learning-platform"
version = "1.0.0"
description = "Production-grade AI-native technical learning platform"
authors = ["Platform Team"]
python = "^3.11"

[tool.poetry.dependencies]
python = "^3.11"

# Web Framework
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.32.0"}
gunicorn = "^23.0.0"
httpx = "^0.27.0"

# Database
sqlalchemy = {extras = ["asyncio"], version = "^2.0.36"}
alembic = "^1.14.0"
asyncpg = "^0.30.0"
psycopg2-binary = "^2.9.9"

# Redis
redis = {extras = ["hiredis"], version = "^5.2.0"}
aioredis = "^2.0.1"

# Kafka
confluent-kafka = "^2.6.0"
aiokafka = "^0.11.0"

# Celery
celery = {extras = ["redis"], version = "^5.4.0"}
flower = "^2.0.1"
celery-redbeat = "^2.2.0"

# Elasticsearch
elasticsearch = {extras = ["async"], version = "^8.16.0"}

# Auth & Security
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-multipart = "^0.0.18"
cryptography = "^43.0.0"
pyotp = "^2.9.0"
qrcode = {extras = ["pil"], version = "^8.0.0"}

# OAuth
authlib = "^1.3.2"
httpx-oauth = "^0.15.0"

# AI / LLM
langchain = "^0.3.0"
langchain-anthropic = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-community = "^0.3.0"
langgraph = "^0.2.50"
langchain-core = "^0.3.0"
openai = "^1.56.0"
anthropic = "^0.39.0"
tiktoken = "^0.8.0"

# Vector Database
chromadb = "^0.5.0"
pgvector = "^0.3.5"
qdrant-client = "^1.12.0"

# Email
fastapi-mail = "^1.4.1"
jinja2 = "^3.1.4"

# File Storage
boto3 = "^1.35.0"
aioboto3 = "^13.2.0"

# Monitoring / Observability
prometheus-client = "^0.21.0"
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-instrumentation-sqlalchemy = "^0.49b0"
opentelemetry-instrumentation-redis = "^0.49b0"
opentelemetry-exporter-jaeger = "^1.21.0"
opentelemetry-exporter-prometheus = "^0.49b0"
structlog = "^24.4.0"

# Validation & Serialization
pydantic = "^2.10.0"
pydantic-settings = "^2.6.0"
pydantic-extra-types = "^2.10.0"
email-validator = "^2.2.0"

# Payments
stripe = "^11.2.0"
razorpay = "^1.4.2"

# Code Execution
docker = "^7.1.0"

# Utilities
python-slugify = "^8.0.4"
arrow = "^1.3.0"
tenacity = "^9.0.0"
cachetools = "^5.5.0"
orjson = "^3.10.0"
ujson = "^5.10.0"
python-dotenv = "^1.0.1"
click = "^8.1.7"
rich = "^13.9.0"
typer = "^0.15.0"

# WebSockets
websockets = "^13.1"

# Rate limiting
slowapi = "^0.1.9"
limits = "^3.14.0"

# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
factory-boy = "^3.3.1"
faker = "^33.0.0"

# Code Quality
ruff = "^0.8.0"
mypy = "^1.13.0"
pre-commit = "^4.0.0"

[tool.ruff]
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "ANN", "S", "B", "A", "COM", "C4", "DTZ", "T10", "EM", "EXE", "ISC", "ICN", "G", "PIE", "T20", "PYI", "Q", "RSE", "RET", "SIM", "TID", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "FLY", "RUF"]
ignore = ["ANN101", "ANN102", "COM812", "ISC001"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=. --cov-report=html --cov-report=term-missing"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
