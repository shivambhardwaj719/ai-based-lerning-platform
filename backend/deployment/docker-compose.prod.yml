version: "3.9"

# Production docker-compose — uses pre-built images, no volume mounts of source code.
# Environment variables should come from a secrets manager (e.g., AWS SSM, Vault).
# Usage: docker-compose -f docker-compose.prod.yml up -d

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-api-env: &api-env
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
  ELASTICSEARCH_URL: ${ELASTICSEARCH_URL}
  QDRANT_URL: ${QDRANT_URL}
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  JWT_SECRET_KEY: ${JWT_SECRET_KEY}
  OPENAI_API_KEY: ${OPENAI_API_KEY}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
  SENDGRID_API_KEY: ${SENDGRID_API_KEY}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
  S3_BUCKET_NAME: ${S3_BUCKET_NAME}
  ENVIRONMENT: production
  LOG_LEVEL: INFO
  JSON_LOGS: "true"

services:
  # ---------- NGINX Reverse Proxy ----------
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      api:
        condition: service_healthy
    restart: always
    logging: *default-logging

  # ---------- FastAPI Application ----------
  api:
    image: ${REGISTRY}/ai-learning-api:${IMAGE_TAG:-latest}
    deploy:
      replicas: 3
      update_config:
        parallelism: 1
        delay: 10s
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    environment:
      <<: *api-env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - postgres
      - redis
    restart: always
    logging: *default-logging

  # ---------- Celery Workers ----------
  worker-default:
    image: ${REGISTRY}/ai-learning-worker:${IMAGE_TAG:-latest}
    command: celery -A workers.celery_app worker -Q default,high_priority -c 4 --loglevel=info
    environment:
      <<: *api-env
    deploy:
      replicas: 2
    restart: always
    logging: *default-logging

  worker-ai:
    image: ${REGISTRY}/ai-learning-worker:${IMAGE_TAG:-latest}
    command: celery -A workers.celery_app worker -Q ai -c 2 --loglevel=info
    environment:
      <<: *api-env
    deploy:
      replicas: 2
    restart: always
    logging: *default-logging

  worker-submission:
    image: ${REGISTRY}/ai-learning-worker:${IMAGE_TAG:-latest}
    command: celery -A workers.celery_app worker -Q submissions -c 8 --loglevel=info
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      <<: *api-env
    deploy:
      replicas: 2
    restart: always
    logging: *default-logging

  celery-beat:
    image: ${REGISTRY}/ai-learning-worker:${IMAGE_TAG:-latest}
    command: celery -A workers.celery_app beat --scheduler redbeat.RedBeatScheduler --loglevel=info
    environment:
      <<: *api-env
    restart: always
    logging: *default-logging

  # ---------- PostgreSQL (managed in prod, shown here for completeness) ----------
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_learning}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging

  # ---------- Redis ----------
  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
